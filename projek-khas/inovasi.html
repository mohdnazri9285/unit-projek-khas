<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Produk Inovasi · Bahagian Mekanisasi & Projek Khas</title>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

    <style>
        /* ========== RESET & VARIABLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sapphire: #2563eb;
            --ruby: #e11d48;
            --platinum: #cbd5e1;
            --cyan: #00e5ff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            
            /* Kursor Mentol Inovasi (Biru Sapphire) */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><path d="M18 2C11.5 2 6.5 7 6.5 13.5C6.5 17.5 9 20.5 11 23V27H25V23C27 20.5 29.5 17.5 29.5 13.5C29.5 7 24.5 2 18 2Z" fill="%232563eb" stroke="%23cbd5e1" stroke-width="1.5"/><path d="M12 28H24V31C24 32.5 22.5 34 21 34H15C13.5 34 12 32.5 12 31V28Z" fill="%23cbd5e1" stroke="%23cbd5e1" stroke-width="1"/><path d="M18 9V17 M15 12L18 17 L21 12" stroke="%2300e5ff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="18" cy="17" r="1.5" fill="%2300e5ff"/></svg>') 18 18, auto;
            
            /* Efek Carbon Fibre */
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15) 0%, transparent 70%),
                linear-gradient(27deg, #1e293b 5px, transparent 5px),
                linear-gradient(207deg, #1e293b 5px, transparent 5px),
                linear-gradient(27deg, #0f172a 5px, transparent 5px),
                linear-gradient(207deg, #0f172a 5px, transparent 5px),
                linear-gradient(90deg, #111827 10px, transparent 10px),
                linear-gradient(90deg, #111827 10px, transparent 10px);
            background-size: 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 10px 10px, 10px 10px, 20px 20px, 0 0, 10px 10px;
        }

        /* Kursor Mentol (Merah Ruby) untuk hover */
        a, button, .accordion-header, select, tr {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><path d="M18 2C11.5 2 6.5 7 6.5 13.5C6.5 17.5 9 20.5 11 23V27H25V23C27 20.5 29.5 17.5 29.5 13.5C29.5 7 24.5 2 18 2Z" fill="%23e11d48" stroke="%23cbd5e1" stroke-width="1.5"/><path d="M12 28H24V31C24 32.5 22.5 34 21 34H15C13.5 34 12 32.5 12 31V28Z" fill="%23cbd5e1" stroke="%23cbd5e1" stroke-width="1"/><path d="M18 9V17 M15 12L18 17 L21 12" stroke="%23ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="18" cy="17" r="1.5" fill="%23ffffff"/></svg>') 18 18, pointer !important;
        }

        /* Efek Glow Pulse (Aura Kursor) */
        #cursor-aura {
            position: fixed;
            top: 0; left: 0;
            width: 60px; height: 60px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.4) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: pulseAura 1.5s infinite alternate;
            mix-blend-mode: screen;
            transition: width 0.2s, height 0.2s, background 0.2s;
        }
        body:has(a:hover) #cursor-aura, body:has(button:hover) #cursor-aura, body:has(tr:hover) #cursor-aura {
            background: radial-gradient(circle, rgba(225, 29, 72, 0.5) 0%, transparent 60%);
        }
        @keyframes pulseAura {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--sapphire); }

        /* =========================================
           HEADER NAVIGASI (SMART HUD)
           ========================================= */
        .header-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: var(--bg-base); 
            display: flex;
            justify-content: center;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9));
            border-bottom: 1px solid var(--border-color);
        }

        .svg-wrapper {
            position: relative;
            z-index: 2; 
            width: 100%;
            max-width: 1200px;
        }

        .header-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }

        .block-blue { fill: url(#gradSapphire); stroke: #1e3a8a; stroke-width: 1; stroke-linejoin: round; transition: 0.3s; }
        .block-red { fill: url(#gradRuby); stroke: #881337; stroke-width: 1; stroke-linejoin: round; transition: 0.3s; }
        
        .nav-text {
            fill: #ffffff; stroke: #0f172a; stroke-width: 0.5px; paint-order: stroke fill;
            font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 800;
            text-anchor: middle; dominant-baseline: middle; pointer-events: none; letter-spacing: 0.5px;
        }
        .nav-text-center {
            fill: #ffffff; stroke: #0f172a; stroke-width: 0.5px; paint-order: stroke fill;
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 800;
            text-anchor: middle; dominant-baseline: middle; pointer-events: none; letter-spacing: 0.5px;
        }

        .nav-group { transition: 0.3s; }
        .nav-group:hover .block-blue { fill: #3b82f6; filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.5)); }
        .nav-group:hover .block-red { fill: #f43f5e; filter: drop-shadow(0 0 8px rgba(225, 29, 72, 0.5)); }
        .nav-group:hover .nav-text { fill: #fff; stroke: none; }

        .neon-line {
            fill: none; stroke: var(--platinum); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            filter: drop-shadow(0 0 4px #ffffff);
            pointer-events: none; animation: expandFromCenter 4s linear infinite;
        }
        @keyframes expandFromCenter {
            0% { stroke-dashoffset: 1000; opacity: 1; }
            70% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* ========== MAIN CONTAINER ========== */
        .main-container {
            flex: 1;
            padding: 3rem 2rem;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        /* ========== GRID UNTUK 2 GRAF ========== */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 1.5rem;
        }

        @media screen and (max-width: 1000px) {
            .charts-grid { grid-template-columns: 1fr; }
        }

        /* ========== CARDS ========== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 6px; 
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .card::before, .card::after {
            content: ''; position: absolute; width: 30px; height: 2px; background: var(--platinum);
        }
        .card::before { top: -1px; left: -1px; }
        .card::after { bottom: -1px; right: -1px; }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.8rem;
        }
        .card-title i { color: var(--platinum); font-size: 1.1rem; }

        /* ========== CHART CONTAINER ========== */
        .chart-container {
            position: relative;
            height: 320px; 
            width: 100%;
        }

        /* ========== FILTERS ========== */
        .filter-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 1.5rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        
        .filter-select {
            background: #1e293b;
            border: 1px solid var(--sapphire);
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: 'Roboto', sans-serif;
            outline: none;
            min-width: 180px;
            transition: 0.3s;
        }
        .filter-select:focus, .filter-select:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .filter-badge {
            background: rgba(37, 99, 235, 0.2);
            color: var(--cyan);
            border: 1px solid var(--sapphire);
            border-radius: 4px;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: 'Orbitron', sans-serif;
        }

        .filter-reset {
            background: transparent;
            border: 1px solid var(--ruby);
            color: var(--ruby);
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .filter-reset:hover {
            background: var(--ruby);
            color: #fff;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.4);
        }

        /* ========== JADUAL ========== */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 900px;
        }

        th {
            background: rgba(15, 23, 42, 0.9);
            color: var(--platinum);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }

        tr { transition: 0.2s; }
        tr:hover td { background: rgba(37, 99, 235, 0.1); color: #fff; }

        /* ========== PAGINATION ========== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .pagination-btn {
            background: transparent;
            border: 1px solid var(--platinum);
            color: var(--platinum);
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            font-weight: 600;
            transition: 0.3s;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--platinum);
            color: var(--bg-base);
        }

        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        .pagination-info {
            color: var(--platinum);
            font-weight: 500;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        /* ========== POPUP HUD STYLE ========== */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(2, 6, 23, 0.9); backdrop-filter: blur(8px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 1rem;
        }
        
        .popup-card {
            background: #0f172a; border: 1px solid var(--cyan);
            width: 100%; max-width: 550px; padding: 2.5rem; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(0, 229, 255, 0.05);
            position: relative; overflow: hidden;
        }

        .popup-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.03) 2px, rgba(0, 229, 255, 0.03) 4px);
            pointer-events: none; z-index: 0;
        }

        .popup-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 40px; height: 2px;
            background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
        }

        .popup-close {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 1.5rem; position: absolute; top: 15px; right: 20px; z-index: 10;
            transition: 0.3s;
        }
        .popup-close:hover { color: var(--cyan); transform: rotate(90deg); }

        .popup-detail h3 { 
            color: var(--cyan); font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem; margin-bottom: 1.5rem; padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            position: relative; z-index: 1;
        }

        .detail-row {
            margin-bottom: 1rem; padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative; z-index: 1;
        }

        .detail-label {
            font-size: 0.7rem; color: var(--sapphire);
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
        }

        .detail-value {
            font-weight: 400; font-size: 0.95rem; line-height: 1.6;
            margin-top: 0.3rem; color: #e2e8f0;
        }

        /* ========== FOOTER ========== */
        footer {
            text-align: center; padding: 2rem; border-top: 1px solid var(--border-color);
            font-size: 0.8rem; color: var(--text-muted); background: rgba(15, 23, 42, 0.9);
        }

        /* ========== RESPONSIVE ========== */
        @media screen and (max-width: 900px) {
            .main-container { padding: 1.5rem 1rem; gap: 1.5rem; }
            .card { padding: 1.5rem; }
            .filter-select { width: 100%; }
            .filter-row { padding: 1rem; }
        }
    </style>
</head>

    <!-- POPUP DETAIL PRODUK -->
    <div id="detailPopup" class="popup-overlay" style="display: none;">
        <div class="popup-card popup-detail" id="detailPopupContent">
            <!-- Diisi oleh JS -->
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-container">
        
        <!-- BAHAGIAN 1: 2 GRAF (WILAYAH & KATEGORI) -->
        <div class="charts-grid">
            <!-- Carta Bar (Wilayah) -->
            <section class="card">
                <div class="card-title">
                    <i class="fas fa-chart-bar"></i> STATISTIK MENGIKUT WILAYAH 
                    <span id="chartYearLabel" style="color:var(--cyan); font-size:0.9rem; margin-left:auto;">(2026)</span>

                <div class="chart-container">
                    <canvas id="wilayahChart"></canvas>
                </div>
            </section>

            <!-- Carta Donat (Kategori) -->
            <section class="card">
                <div class="card-title">
                    <i class="fas fa-chart-pie"></i> PECAHAN MENGIKUT KATEGORI
                </div>
                <div class="chart-container">
                    <canvas id="kategoriChart"></canvas>
                </div>
            </section>
        </div>

        <!-- BAHAGIAN 2: JADUAL DATA -->
        <section class="card">

            <!-- FILTER -->
            <div class="filter-row">
                <select id="tahunFilter" class="filter-select" onchange="applyAllFilters()">

                    <option value="2025">Tahun: 2025</option>
                    <option value="2024">Tahun: 2024</option>
                </select>

                <select id="wilayahFilter" class="filter-select" onchange="applyAllFilters()">
                    <option value="SEMUA">Semua Wilayah</option>
                </select>

                <select id="kategoriFilter" class="filter-select" onchange="applyAllFilters()">
                    <option value="SEMUA">Semua Kategori</option>
                    <option value="Digital & Data">Digital & Data</option>
                    <option value="Inovasi Operasi Ladang">Inovasi Operasi Ladang</option>

                 </table>

            <!-- PAGINATION -->
            <div class="pagination">
                <button class="pagination-btn" id="prevPage" onclick="changePage(-1)" disabled><i class="fas fa-chevron-left"></i> Prev</button>
                <span class="pagination-info" id="pageInfo">Halaman 1 / 1</span>
                <button class="pagination-btn" id="nextPage" onclick="changePage(1)">Next <i class="fas fa-chevron-right"></i></button>
            </div>

            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.85rem;">
                <i class="fas fa-hand-pointer"></i> Klik pada baris untuk lihat detail penuh
            </p>

    </main>
    
    <footer>
        <i class="fas fa-copyright"></i> Bahagian Mekanisasi & Projek Khas · #InovasiLestari
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // Logik Kursor Aura (Glow Pulse)
        const aura = document.getElementById('cursor-aura');
        document.addEventListener('mousemove', (e) => {
            aura.style.left = e.clientX + 'px';
            aura.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseleave', () => { aura.style.opacity = '0'; });
        document.addEventListener('mouseenter', () => { aura.style.opacity = '1'; });

        // Data
        const inovasi2024 = [
            { wilayah: "Mempaga", projek: "Ek Releaer 2000", kategori: "Inovasi Operasi Ladang", obj: "Mempercepatkan Proses Penyebaran Kumbang E.k" },
            { wilayah: "Mempaga", projek: "Pests Alarm Solar", kategori: "ESG & Kesejahteraan", obj: "Mengurangkan Gangguan Oleh Haiwan Perosak Di Kawasan Ladang" },

        const customLeaderLinePlugin = {
            id: 'customLeaderLine',
            afterDraw(chart, args, options) {
                const { ctx } = chart;
                const meta = chart.getDatasetMeta(0);
                if (!meta.data || meta.data.length === 0) return;

                const centerX = meta.data[0].x;
                const centerY = meta.data[0].y;
                const radius = meta.data[0].outerRadius;
                const data = chart.data.datasets[0].data;
                const labels = chart.data.labels;
                const colors = chart.data.datasets[0].backgroundColor;

                ctx.save();
                ctx.font = "bold 10px 'Roboto'";
                ctx.fillStyle = "#cbd5e1";
                ctx.textBaseline = "middle";

                meta.data.forEach((element, index) => {
                    const angle = (element.startAngle + element.endAngle) / 2;
                    const midCos = Math.cos(angle);
                    const midSin = Math.sin(angle);

                    const startX = centerX + midCos * radius;
                    const startY = centerY + midSin * radius;
                    const elbowX = centerX + midCos * (radius + 10);
                    const elbowY = centerY + midSin * (radius + 10);
                    const isRight = midCos >= 0;
                    const endX = elbowX + (isRight ? 15 : -15);
                    const endY = elbowY;

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(elbowX, elbowY);
                    ctx.lineTo(endX, endY);
                    ctx.strokeStyle = colors[index];
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(endX, endY, 2, 0, Math.PI * 2);
                    ctx.fillStyle = colors[index];
                    ctx.fill();

                    ctx.textAlign = isRight ? "left" : "right";
                    const textX = endX + (isRight ? 5 : -5);
                    const labelText = `${labels[index]} (${data[index]})`;
                    ctx.fillText(labelText, textX, endY);
                });
                ctx.restore();
            }
        };

                    meta.data.forEach((element, index) => {

                        ctx.font = "bold 13px 'Orbitron'"; // Font Futuristik
                        ctx.fillStyle = "#00e5ff"; // Warna Cyan Neon
                        ctx.textAlign = "center";

                        // Efek Glow pada teks
                        ctx.shadowColor = "#00e5ff";

                        // Lukis teks sedikit di atas bar
                        ctx.fillText(value, element.x, element.y - 8);
                        ctx.restore();
                    });
                }
            }
        };

        function populateWilayahFilter() {

            const filterSelect = document.getElementById('wilayahFilter');
            filterSelect.innerHTML = '<option value="SEMUA">Semua Wilayah</option>';
            sortedWilayah.forEach(w => { const opt = document.createElement('option'); opt.value = w; opt.textContent = w; filterSelect.appendChild(opt); });
        }

        function applyAllFilters() {
            const tahun = document.getElementById('tahunFilter').value;
            const wilayah = document.getElementById('wilayahFilter').value;
            const kategori = document.getElementById('kategoriFilter').value;

            currentData = [...semuaData[tahun]];
            document.getElementById('chartYearLabel').innerText = `(${tahun})`;
            
            let filtered = [...currentData];
            if (wilayah !== "SEMUA") filtered = filtered.filter(item => item.wilayah === wilayah);
            if (kategori !== "SEMUA") filtered = filtered.filter(item => item.kategori === kategori);

            filteredData = filtered;
            currentPage = 1;

            populateWilayahFilter();
            renderTable();
            
            renderWilayahChart(tahun);
            renderKategoriChart(tahun);
        }

        function renderTable() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = filteredData.slice(start, end);

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = pageData.map(item => `
                <tr onclick="showDetailPopup(${item.bil})">
                    <td>${item.bil}</td>
                    <td>${item.wilayah}</td>
                    <td style="font-weight:500; color:#fff;">${item.projek}</td>
                    <td>${item.kategori}</td>
                </tr>
            `).join('');

            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            document.getElementById('pageInfo').innerText = `Halaman ${currentPage} / ${totalPages || 1}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages || totalPages === 0;
            document.getElementById('filterCount').innerText = `${filteredData.length} / ${currentData.length} Produk`;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderTable();
        }

        // GRAF 1: Carta Bar Wilayah (Guna Custom Label Plugin)
        function renderWilayahChart(tahun) {
            const dataTahun = semuaData[tahun];
            const wilayahCount = {};
            dataTahun.forEach(item => {
                wilayahCount[item.wilayah] = (wilayahCount[item.wilayah] || 0) + 1;
            });
            
            const labels = Object.keys(wilayahCount);
            const dataValues = Object.values(wilayahCount);
            
            const ctx = document.getElementById('wilayahChart').getContext('2d');
            if (wilayahChartInstance) wilayahChartInstance.destroy();

            wilayahChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Bilangan Inovasi',
                        data: dataValues,
                        backgroundColor: 'rgba(37, 99, 235, 0.6)',
                        borderColor: '#2563eb',
                        borderWidth: 1,
                        borderRadius: 4,
                        hoverBackgroundColor: '#00e5ff',
                        hoverBorderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 25 } }, // Padding atas untuk teks label
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleFont: { family: 'Montserrat', size: 13 },
                            bodyFont: { family: 'Roboto', size: 14 },
                            borderColor: '#2563eb',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8', font: { family: 'Roboto', size: 11 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8', font: { family: 'Roboto', size: 10 } }
                        }
                    }
                },
                plugins: [customBarLabelsPlugin] // Daftarkan plugin
            });
        }

        // GRAF 2: Carta Donat Kategori (Guna Garisan Label Plugin)
        function renderKategoriChart(tahun) {
            const dataTahun = semuaData[tahun];
            const kategoriCount = {};
            dataTahun.forEach(item => {
                kategoriCount[item.kategori] = (kategoriCount[item.kategori] || 0) + 1;
            });

            const labels = Object.keys(kategoriCount);
            const dataValues = Object.values(kategoriCount);

            const ctx = document.getElementById('kategoriChart').getContext('2d');
            if (kategoriChartInstance) kategoriChartInstance.destroy();

            kategoriChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: [
                            '#2563eb', // Sapphire
                            '#00e5ff', // Cyan
                            '#e11d48', // Ruby
                            '#cbd5e1'  // Platinum
                        ],
                        borderColor: '#0f172a',
                        borderWidth: 2,
                        hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 20, bottom: 20, left: 70, right: 70 } },
                    cutout: '55%', 
                    plugins: {
                        legend: { display: false }, 
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleFont: { family: 'Montserrat', size: 13 },
                            bodyFont: { family: 'Roboto', size: 14 },
                            borderColor: '#00e5ff',
                            borderWidth: 1
                        }
                    }
                },
                plugins: [customLeaderLinePlugin] 
            });
        }

        function showDetailPopup(bil) {
            const item = currentData.find(i => i.bil === bil);
            if (!item) return;
            const popup = document.getElementById('detailPopupContent');
            popup.innerHTML = `
                <button class="popup-close" onclick="closeDetailPopup()"><i class="fas fa-times-circle"></i></button>
                <h3><i class="fas fa-folder-open"></i> ${item.projek}</h3>
                
                <div class="detail-row">
                    <div class="detail-label">Wilayah</div>
                    <div class="detail-value">${item.wilayah}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Kategori</div>
                    <div class="detail-value">${item.kategori}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Bil</div>
                    <div class="detail-value">#${item.bil}</div>
                </div>
                <div class="detail-row" style="border:none;">
                    <div class="detail-label">Objektif / Keterangan</div>
                    <div class="detail-value">${item.obj || "Tiada keterangan terperinci."}</div>
                </div>
                
                <div style="text-align: center; margin-top: 2rem;">
                    <button onclick="closeDetailPopup()" style="background:transparent; color:var(--cyan); border:1px solid var(--cyan); padding:0.6rem 2rem; font-weight:600; cursor:pointer; font-family:'Montserrat'; text-transform:uppercase; letter-spacing:1px; transition:0.3s; border-radius:4px;" onmouseover="this.style.background='rgba(0, 229, 255, 0.1)'" onmouseout="this.style.background='transparent'">Tutup</button>
                </div>
            `;
            document.getElementById('detailPopup').style.display = 'flex';
        }

        function closeDetailPopup() { 
            document.getElementById('detailPopup').style.display = 'none'; 
        }

        document.addEventListener('DOMContentLoaded', () => {
            populateWilayahFilter();
            renderTable();
            renderWilayahChart(currentTahun);
            renderKategoriChart(currentTahun);
        });

        window.showDetailPopup = showDetailPopup;
        window.closeDetailPopup = closeDetailPopup;
        window.applyAllFilters = applyAllFilters;
        window.resetAllFilters = resetAllFilters;
        window.changePage = changePage;
    </script>
</body>
</html>
