<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>bajet Tracker · Bahagian Mekanisasi & Projek Khas</title>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        /* ========== RESET & VARIABLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sapphire: #2563eb;
            --ruby: #e11d48;
            --platinum: #cbd5e1;
            --cyan: #00e5ff;
            --orange: #f59e0b;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            
            /* Kursor Mentol Inovasi (Biru Sapphire) */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><path d="M18 2C11.5 2 6.5 7 6.5 13.5C6.5 17.5 9 20.5 11 23V27H25V23C27 20.5 29.5 17.5 29.5 13.5C29.5 7 24.5 2 18 2Z" fill="%232563eb" stroke="%23cbd5e1" stroke-width="1.5"/><path d="M12 28H24V31C24 32.5 22.5 34 21 34H15C13.5 34 12 32.5 12 31V28Z" fill="%23cbd5e1" stroke="%23cbd5e1" stroke-width="1"/><path d="M18 9V17 M15 12L18 17 L21 12" stroke="%2300e5ff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="18" cy="17" r="1.5" fill="%2300e5ff"/></svg>') 18 18, auto;
            
            /* Efek Carbon Fibre */
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15) 0%, transparent 70%),
                linear-gradient(27deg, #1e293b 5px, transparent 5px),
                linear-gradient(207deg, #1e293b 5px, transparent 5px),
                linear-gradient(27deg, #0f172a 5px, transparent 5px),
                linear-gradient(207deg, #0f172a 5px, transparent 5px),
                linear-gradient(90deg, #111827 10px, transparent 10px),
                linear-gradient(90deg, #111827 10px, transparent 10px);
            background-size: 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 10px 10px, 10px 10px, 20px 20px, 0 0, 10px 10px;
        }

        /* Kursor Mentol (Merah Ruby) untuk hover */
        a, button {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><path d="M18 2C11.5 2 6.5 7 6.5 13.5C6.5 17.5 9 20.5 11 23V27H25V23C27 20.5 29.5 17.5 29.5 13.5C29.5 7 24.5 2 18 2Z" fill="%23e11d48" stroke="%23cbd5e1" stroke-width="1.5"/><path d="M12 28H24V31C24 32.5 22.5 34 21 34H15C13.5 34 12 32.5 12 31V28Z" fill="%23cbd5e1" stroke="%23cbd5e1" stroke-width="1"/><path d="M18 9V17 M15 12L18 17 L21 12" stroke="%23ffffff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="18" cy="17" r="1.5" fill="%23ffffff"/></svg>') 18 18, pointer !important;
        }

        /* Efek Glow Pulse (Aura Kursor) */
        #cursor-aura {
            position: fixed;
            top: 0; left: 0;
            width: 60px; height: 60px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.4) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: pulseAura 1.5s infinite alternate;
            mix-blend-mode: screen;
            transition: width 0.2s, height 0.2s, background 0.2s;
        }
        body:has(a:hover) #cursor-aura, body:has(button:hover) #cursor-aura {
            background: radial-gradient(circle, rgba(225, 29, 72, 0.5) 0%, transparent 60%);
        }
        @keyframes pulseAura {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--sapphire); }

        /* =========================================
           HEADER NAVIGASI (SMART HUD)
           ========================================= */
        .header-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: var(--bg-base); 
            display: flex;
            justify-content: center;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9));
            border-bottom: 1px solid var(--border-color);
        }

        .svg-wrapper {
            position: relative;
            z-index: 2; 
            width: 100%;
            max-width: 1200px;
        }

        .header-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }

        .block-blue { fill: url(#gradSapphire); stroke: #1e3a8a; stroke-width: 1; stroke-linejoin: round; transition: 0.3s; }
        .block-red { fill: url(#gradRuby); stroke: #881337; stroke-width: 1; stroke-linejoin: round; transition: 0.3s; }
        
        .nav-text {
            fill: #ffffff; stroke: #0f172a; stroke-width: 0.5px; paint-order: stroke fill;
            font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 800;
            text-anchor: middle; dominant-baseline: middle; pointer-events: none; letter-spacing: 0.5px;
        }
        .nav-text-center {
            fill: #ffffff; stroke: #0f172a; stroke-width: 0.5px; paint-order: stroke fill;
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 800;
            text-anchor: middle; dominant-baseline: middle; pointer-events: none; letter-spacing: 0.5px;
        }

        .nav-group { transition: 0.3s; }
        .nav-group:hover .block-blue { fill: #3b82f6; filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.5)); }
        .nav-group:hover .block-red { fill: #f43f5e; filter: drop-shadow(0 0 8px rgba(225, 29, 72, 0.5)); }
        .nav-group:hover .nav-text { fill: #fff; stroke: none; }

        .neon-line {
            fill: none; stroke: var(--platinum); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            filter: drop-shadow(0 0 4px #ffffff);
            pointer-events: none; animation: expandFromCenter 4s linear infinite;
        }
        @keyframes expandFromCenter {
            0% { stroke-dashoffset: 1000; opacity: 1; }
            70% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* ========== MAIN CONTAINER ========== */
        .main-container {
            flex: 1;
            padding: 3rem 2rem;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center; /* Pusatkan kandungan secara menegak */
        }

        /* =========================================
           LOCKED SCREEN CARD
           ========================================= */
        .lock-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 6px; 
            padding: 4rem 3rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            text-align: center;
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        /* Aksen Sudut Logam */
        .lock-card::before, .lock-card::after {
            content: ''; position: absolute; width: 40px; height: 2px; background: var(--ruby);
        }
        .lock-card::before { top: -1px; left: -1px; }
        .lock-card::after { bottom: -1px; right: -1px; }

        /* Efek Scanline */
        .lock-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.02) 2px, rgba(0, 229, 255, 0.02) 4px);
            pointer-events: none; z-index: 0;
        }

        .lock-icon {
            font-size: 4rem;
            color: var(--ruby);
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
            animation: pulseLock 2s infinite alternate;
        }

        @keyframes pulseLock {
            0% { text-shadow: 0 0 10px rgba(225, 29, 72, 0.3); }
            100% { text-shadow: 0 0 30px rgba(225, 29, 72, 0.8), 0 0 50px rgba(225, 29, 72, 0.4); }
        }

        .lock-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1rem;
            position: relative; z-index: 1;
        }

        .lock-desc {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            position: relative; z-index: 1;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        .status-badge-hold {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: var(--orange);
            border: 1px solid var(--orange);
            padding: 0.4rem 1.2rem;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            position: relative; z-index: 1;
        }

        .btn-login {
            background: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 0.8rem 3rem;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            position: relative; z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        /* ========== FOOTER ========== */
        footer {
            text-align: center; padding: 2rem; border-top: 1px solid var(--border-color);
            font-size: 0.8rem; color: var(--text-muted); background: rgba(15, 23, 42, 0.9);
        }

        /* ========== RESPONSIVE ========== */
        @media screen and (max-width: 900px) {
            .main-container { padding: 1.5rem 1rem; }
            .lock-card { padding: 3rem 1.5rem; }
            .lock-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- EFEK GLOW PULSE (AURA) -->
    <div id="cursor-aura"></div>

    <!-- HEADER NAVIGASI (SMART HUD) -->
    <header class="header-wrapper">
        <div class="svg-wrapper">
            <svg class="header-svg" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="gradSapphire" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1e3a8a" />
                        <stop offset="100%" stop-color="#2563eb" />
                    </linearGradient>
                    <linearGradient id="gradRuby" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#881337" />
                        <stop offset="100%" stop-color="#e11d48" />
                    </linearGradient>
                </defs>

                <a href="coe.html" class="nav-group">
                    <polygon class="block-blue" points="0,0 190,0 150,35 70,35" />
                    <text x="95" y="20" class="nav-text">COE</text>
                </a>
                
                <a href="sop.html" class="nav-group">
                    <polygon class="block-blue" points="130,0 335,0 285,50 195,50" />
                    <text x="232.5" y="28" class="nav-text">SOP</text>
                </a>
                
                <a href="mekanisasi.html" class="nav-group">
                    <polygon class="block-blue" points="260,0 480,0 420,65 320,65" />
                    <text x="370" y="36" class="nav-text">MEKANISASI</text>
                </a>

                <a href="index.html" class="nav-group">
                    <polygon class="block-red" points="400,0 800,0 720,85 480,85" />
                    <text x="600" y="32" class="nav-text-center">BAHAGIAN MEKANISASI &amp;</text>
                    <text x="600" y="52" class="nav-text-center">PROJEK KHAS FPMSB</text>
                </a>
                
                <a href="inovasi.html" class="nav-group">
                    <polygon class="block-blue" points="720,0 940,0 880,65 780,65" />
                    <text x="830" y="36" class="nav-text">INOVASI</text>
                </a>
                
                <a href="paten.html" class="nav-group">
                    <polygon class="block-blue" points="865,0 1070,0 1005,50 915,50" />
                    <text x="967.5" y="28" class="nav-text">PATEN</text>
                </a>
                
                <a href="bajet.html" class="nav-group">
                    <polygon class="block-blue" points="1010,0 1200,0 1130,35 1050,35" />
                    <text x="1105" y="20" class="nav-text">BAJET</text>
                </a>

                <path class="neon-line" d="M 600,85 L 480,85 L 420,65 L 320,65 L 285,50 L 195,50 L 150,35 L 70,35 L 0,35" />
                <path class="neon-line" d="M 600,85 L 720,85 L 780,65 L 880,65 L 915,50 L 1005,50 L 1050,35 L 1130,35 L 1200,35" />
            </svg>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-container">
        
        <div class="lock-card">
            <!-- Status Badge -->
            <div class="status-badge-hold">
                <i class="fas fa-tools"></i> STATUS: AKAN DIKEMASKINI
            </div>

            <!-- Ikon Kunci -->
            <div>
                <i class="fas fa-lock lock-icon"></i>
            </div>

            <!-- Teks -->
            <h1 class="lock-title">Akses Terhad</h1>
            <p class="lock-desc">
                Halaman <strong>bajet Tracker</strong> ini memerlukan pengesahan identiti (User Authentication). 
                Sila log masuk dengan akaun rasmi untuk melihat data kewangan dan peruntukan bajet.
            </p>

            <!-- Butang Placeholder -->
            <button class="btn-login" onclick="alert('Sistem Log Masuk (Authentication) akan diaktifkan tidak lama lagi.');">
                <i class="fas fa-sign-in-alt"></i> Log Masuk
            </button>
        </div>

    </main>
    
    <footer>
        <i class="fas fa-copyright"></i> Bahagian Mekanisasi & Projek Khas · #InovasiLestari
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // Logik Kursor Aura (Glow Pulse)
        const aura = document.getElementById('cursor-aura');
        document.addEventListener('mousemove', (e) => {
            aura.style.left = e.clientX + 'px';
            aura.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseleave', () => { aura.style.opacity = '0'; });
        document.addEventListener('mouseenter', () => { aura.style.opacity = '1'; });
    </script>
</body>
</html>
